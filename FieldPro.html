<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FieldPro</title>
<style>
:root{--bg:#0b0d0c;--card:#151917;--bd:#252b28;--tx:#e8efe9;--mu:#8a968e;--g:#22e06b;--r:#ff5d5d;--y:#ffc94d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh}
aside{width:220px;background:#101311;border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:800;font-size:20px;padding:4px 10px 18px}.logo b{color:var(--g)}
nav button{display:flex;gap:10px;width:100%;background:none;border:0;color:var(--mu);padding:11px 12px;border-radius:10px;font:inherit;cursor:pointer;transition:.15s;text-align:left}
nav button:hover{background:#1a201d;color:var(--tx)}nav button.on{background:rgba(34,224,107,.12);color:var(--g);font-weight:600}
main{flex:1;padding:24px;min-width:0;max-width:1200px}
h1{margin:0 0 4px;font-size:24px}.sub{color:var(--mu);margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;transition:.2s}
.card:hover{border-color:#34403a}.k{color:var(--mu);font-size:12px}.v{font-size:24px;font-weight:700;margin-top:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
h3{margin:0 0 12px;font-size:15px}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse}th{color:var(--mu);font-weight:500;font-size:12px;text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid #1d2320;white-space:nowrap}tr:hover td{background:#1a201d}
.btn{background:var(--g);color:#04120a;border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn.s{background:#222a26;color:var(--tx);padding:6px 10px;font-weight:500}.btn.d{background:#3a1c1c;color:var(--r)}
input,select{background:#0f1311;border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:9px;font:inherit;width:100%}
input:focus,select:focus{outline:2px solid var(--g);outline-offset:-1px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.bar input,.bar select{width:auto;min-width:140px}
.tag{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600}.pago,.ativo{background:rgba(34,224,107,.15);color:var(--g)}.pendente,.aguardando{background:rgba(255,201,77,.15);color:var(--y)}.atrasado{background:rgba(255,93,93,.15);color:var(--r)}.cancelado,.inativo{background:#252b28;color:var(--mu)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:20px;width:min(440px,92vw)}dialog::backdrop{background:rgba(0,0,0,.7)}
label{display:block;color:var(--mu);font-size:12px;margin:10px 0 4px}.empty{color:var(--mu);padding:20px;text-align:center}
.note{background:rgba(255,201,77,.08);border:1px solid rgba(255,201,77,.3);color:var(--y);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;padding:8px}nav{display:flex;overflow-x:auto;gap:4px}nav button{white-space:nowrap;width:auto}.logo{padding:4px 10px}main{padding:14px}}
</style></head><body>
<aside><div class="logo">Field<b>Pro</b></div><nav id="nav"></nav></aside>
<main id="m"></main><dialog id="dg"></dialog>
<script>
let S={t:[],a:[],c:[],p:[],e:[],msg:'Olá, tudo bem? Estamos entrando em contato para lembrar que a mensalidade de {aluno}, referente a {mes}, no valor de {valor}, está pendente. Se já realizou o pagamento, por favor, desconsidere esta mensagem. Obrigado!'};
try{const x=localStorage.getItem('fieldpro');if(x)S=JSON.parse(x)}catch(e){}
S.p=S.p||[];S.e=S.e||[];const save=()=>{try{localStorage.setItem('fieldpro',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const L=new Date(),pad=n=>String(n).padStart(2,'0'),today=`${L.getFullYear()}-${pad(L.getMonth()+1)}-${pad(L.getDate())}`,curM=today.slice(0,7);
const R=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),D=s=>s?s.split('-').reverse().join('/'):'-';
const MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],ML=m=>{const[y,n]=m.split('-');return MN[n-1]+'/'+y};
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const age=n=>{if(!n)return'-';const b=new Date(n);let a=L.getFullYear()-b.getFullYear();if(L<new Date(L.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const paid=c=>c.pag.reduce((s,p)=>s+p.v,0),debt=c=>Math.max(0,c.valor-paid(c));
const st=c=>c.canc?'cancelado':paid(c)>=c.valor?'pago':c.venc<today?'atrasado':'pendente';
const al=id=>S.a.find(x=>x.id==id)||{nome:'(removido)',tel:''},tu=id=>S.t.find(x=>x.id==id);
const tag=s=>`<span class="tag ${s}">${s[0].toUpperCase()+s.slice(1)}</span>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wa=c=>{const a=al(c.aid),t='55'+a.tel.replace(/\D/g,'').replace(/^55/,'');const msg=S.msg.replace('{aluno}',a.nome).replace('{mes}',ML(c.mes)).replace('{valor}',R(debt(c)));return`https://wa.me/${t}?text=${encodeURIComponent(msg)}`};
const open=(c)=>{const a=al(c.aid);if(!a.tel){alert('Aluno sem telefone cadastrado.');return}window.open(wa(c),'_blank','noopener')};

function form(title,fields,v,ok){const d=$('dg');d.innerHTML=`<h3>${title}</h3><div>${fields.map(f=>`<label>${f.l}</label>${f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]}" ${o[0]==v[f.k]?'selected':''}>${o[1]}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" ${f.t=='number'?'step="0.01" min="0"':''} value="${esc(v[f.k]??'')}">`}`).join('')}</div><div class="bar" style="margin:16px 0 0;justify-content:flex-end"><button class="btn s" id="cx">Cancelar</button><button class="btn" id="ok">Salvar</button></div>`;
d.showModal();$('cx').onclick=()=>d.close();$('ok').onclick=()=>{const o={};for(const f of fields){let x=$('f_'+f.k).value.trim();if(f.t=='number')x=parseFloat(x);if(f.req&&(x===''||Number.isNaN(x))){alert('Preencha: '+f.l);return}o[f.k]=Number.isNaN(x)?0:x}if(ok(o)!==false)d.close()}}

const tabs=[['dash','▦ Dashboard'],['alunos','☺ Alunos'],['turmas','⚑ Turmas'],['fin','$ Mensalidades'],['inad','! Inadimplência'],['pres','✓ Presença'],['desp','− Despesas']];
let tab='dash',F={q:'',t:'',s:'',m:curM,mind:0,pd:today,pt:''};
function go(t){tab=t;draw()}
function draw(){$('nav').innerHTML=tabs.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');$('m').innerHTML=V[tab]();save()}

const V={
dash(){const act=S.a.filter(a=>a.status=='ativo'),cs=S.c.filter(c=>!c.canc);
const rec=S.c.flatMap(c=>c.pag).filter(p=>p.d.startsWith(curM)).reduce((s,p)=>s+p.v,0);
const pend=cs.filter(c=>st(c)=='pendente').reduce((s,c)=>s+debt(c),0),atr=cs.filter(c=>st(c)=='atrasado');
const atrV=atr.reduce((s,c)=>s+debt(c),0),venc=cs.filter(c=>c.venc<=today).length,inad=venc?Math.round(atr.length/venc*100):0;
const ms=[];for(let i=5;i>=0;i--){const d=new Date(L.getFullYear(),L.getMonth()-i,1);ms.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`)}
const r=ms.map(m=>S.c.flatMap(c=>c.pag).filter(p=>p.d.startsWith(m)).reduce((s,p)=>s+p.v,0)),p=ms.map(m=>cs.filter(c=>c.mes==m).reduce((s,c)=>s+debt(c),0));
const mx=Math.max(1,...r,...p),bars=ms.map((m,i)=>{const x=i*90+20,h1=r[i]/mx*150,h2=p[i]/mx*150;return`<rect x="${x}" y="170-${h1}" width="30" height="${h1}" rx="4" fill="#22e06b" transform="translate(0,0)" style="transform-origin:bottom"/><rect x="${x+34}" y="${170-h2}" width="30" height="${h2}" rx="4" fill="#ffc94d"/><text x="${x+32}" y="190" fill="#8a968e" font-size="11" text-anchor="middle">${ML(m).slice(0,3)}</text>`}).join('').replace(/y="170-[\d.]+"/g,m=>m);
const bars2=ms.map((m,i)=>{const x=i*90+20,h1=r[i]/mx*150,h2=p[i]/mx*150;return`<rect x="${x}" y="${170-h1}" width="30" height="${h1}" rx="4" fill="#22e06b"/><rect x="${x+34}" y="${170-h2}" width="30" height="${h2}" rx="4" fill="#ffc94d"/><text x="${x+32}" y="188" fill="#8a968e" font-size="11" text-anchor="middle">${ML(m).slice(0,3)}</text>`}).join('');
const prox=cs.filter(c=>st(c)=='pendente'&&days(today,c.venc)<=7).sort((a,b)=>a.venc<b.venc?-1:1).slice(0,6);
const ult=S.c.flatMap(c=>c.pag.map(x=>({...x,aid:c.aid}))).sort((a,b)=>a.d<b.d?1:-1).slice(0,6);
const kp=(k,v,c)=>`<div class="card"><div class="k">${k}</div><div class="v" ${c?`style="color:${c}"`:''}>${v}</div></div>`;
return`<h1>Dashboard</h1><div class="sub">Visão geral da escolinha · dados reais cadastrados</div>
${S.a.length+S.t.length==0?`<div class="note">Comece cadastrando turmas e alunos. <button class="btn s" onclick="demo()">Carregar dados de exemplo</button></div>`:''}
<div class="grid">${kp('Alunos ativos',act.length)}${kp('Novos no mês',S.a.filter(a=>(a.mat||'').startsWith(curM)).length)}${kp('Turmas',S.t.length)}${kp('Recebido no mês',R(rec),'var(--g)')}${kp('A vencer (pendente)',R(pend),'var(--y)')}${kp('Atrasado',R(atrV),'var(--r)')}${kp('Mensalidades atrasadas',atr.length)}${kp('Inadimplência',inad+'%')}</div>
<div class="two"><div class="card"><h3>Recebido <span style="color:var(--g)">■</span> × A receber <span style="color:var(--y)">■</span> (6 meses)</h3><svg viewBox="0 0 560 195" width="100%">${bars2}</svg></div>
<div class="card"><h3>Evolução de alunos (matrículas por mês)</h3><svg viewBox="0 0 560 195" width="100%">${(()=>{const n=ms.map(m=>S.a.filter(a=>(a.mat||'').slice(0,7)<=m).length),mm=Math.max(1,...n);return`<polyline fill="none" stroke="#22e06b" stroke-width="3" points="${n.map((v,i)=>`${i*100+40},${170-v/mm*140}`).join(' ')}"/>`+n.map((v,i)=>`<circle cx="${i*100+40}" cy="${170-v/mm*140}" r="4" fill="#22e06b"/><text x="${i*100+40}" y="${160-v/mm*140}" fill="#e8efe9" font-size="12" text-anchor="middle">${v}</text><text x="${i*100+40}" y="188" fill="#8a968e" font-size="11" text-anchor="middle">${ML(ms[i]).slice(0,3)}</text>`).join('')})()}</svg></div></div>
<div class="two"><div class="card"><h3>Vencem nos próximos 7 dias</h3>${prox.length?prox.map(c=>`<div style="display:flex;justify-content:space-between;padding:6px 0"><span>${esc(al(c.aid).nome)}</span><span>${D(c.venc)} · ${R(debt(c))}</span></div>`).join(''):'<div class="empty">Nada a vencer</div>'}</div>
<div class="card"><h3>Últimos pagamentos</h3>${ult.length?ult.map(p=>`<div style="display:flex;justify-content:space-between;padding:6px 0"><span>${esc(al(p.aid).nome)}</span><span>${D(p.d)} · ${R(p.v)}</span></div>`).join(''):'<div class="empty">Sem pagamentos</div>'}</div></div>`},

alunos(){let l=S.a.filter(a=>(!F.q||a.nome.toLowerCase().includes(F.q.toLowerCase()))&&(!F.t||a.tid==F.t)&&(!F.s||a.status==F.s)).sort((a,b)=>a.nome.localeCompare(b.nome));
return`<h1>Alunos</h1><div class="sub">${l.length} de ${S.a.length}</div><div class="bar"><input placeholder="Buscar por nome" value="${esc(F.q)}" oninput="F.q=this.value;draw();const e=$('q');e.focus();e.setSelectionRange(99,99)" id="q"><select onchange="F.t=this.value;draw()"><option value="">Todas as turmas</option>${S.t.map(t=>`<option value="${t.id}" ${F.t==t.id?'selected':''}>${esc(t.nome)}</option>`).join('')}</select><select onchange="F.s=this.value;draw()"><option value="">Todos os status</option>${['ativo','inativo','aguardando'].map(s=>`<option ${F.s==s?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="fAluno()">+ Novo aluno</button></div>
<div class="card tb">${l.length?`<table><tr><th>Nome</th><th>Idade</th><th>Turma</th><th>Responsável</th><th>Telefone</th><th>Mensalidade</th><th>Venc.</th><th>Status</th><th></th></tr>${l.map(a=>{const t=tu(a.tid),fora=t&&t.min!=null&&(age(a.nasc)<t.min||age(a.nasc)>t.max);return`<tr><td>${esc(a.nome)}</td><td>${age(a.nasc)}${fora?' <span title="Fora da faixa etária da turma" style="color:var(--y)">⚠</span>':''}</td><td>${t?esc(t.nome):'-'}</td><td>${esc(a.resp)}</td><td>${esc(a.tel)}</td><td>${R(a.valor)}</td><td>dia ${a.venc}</td><td>${tag(a.status)}</td><td><button class="btn s" onclick="fAluno('${a.id}')">Editar</button> <button class="btn s d" onclick="delA('${a.id}')">Excluir</button></td></tr>`}).join('')}</table>`:'<div class="empty">Nenhum aluno encontrado</div>'}</div>`},

turmas(){return`<h1>Turmas</h1><div class="sub">Categorias, horários e vagas</div><div class="bar"><button class="btn" onclick="fTurma()">+ Nova turma</button></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${S.t.length?S.t.map(t=>{const n=S.a.filter(a=>a.tid==t.id&&a.status!='inativo').length,v=t.cap-n;return`<div class="card"><div style="display:flex;justify-content:space-between"><b>${esc(t.nome)}</b><span class="tag ativo">${esc(t.cat)}</span></div><div class="k" style="margin:8px 0">Prof. ${esc(t.prof)||'-'} · ${esc(t.dias)} · ${esc(t.ini)}–${esc(t.fim)}<br>${esc(t.local)}</div><div>${n}/${t.cap} alunos · ${v>0?`<span style="color:var(--g)">${v} vagas</span>`:'<span style="color:var(--r)">⚠ Turma lotada</span>'}</div><div class="bar" style="margin:12px 0 0"><button class="btn s" onclick="fTurma('${t.id}')">Editar</button><button class="btn s d" onclick="delT('${t.id}')">Excluir</button></div></div>`}).join(''):'<div class="empty">Nenhuma turma</div>'}</div>`},

fin(){const l=S.c.filter(c=>!F.m||c.mes==F.m).sort((a,b)=>a.venc<b.venc?-1:1);
return`<h1>Mensalidades</h1><div class="sub">Status calculado automaticamente pela data de hoje (${D(today)})</div><div class="bar"><input type="month" value="${F.m}" onchange="F.m=this.value;draw()"><button class="btn" onclick="gerar()">Gerar cobranças do mês</button></div>
<div class="card tb">${l.length?`<table><tr><th>Aluno</th><th>Mês</th><th>Valor</th><th>Pago</th><th>Em aberto</th><th>Vencimento</th><th>Status</th><th></th></tr>${l.map(c=>`<tr><td>${esc(al(c.aid).nome)}</td><td>${ML(c.mes)}</td><td>${R(c.valor)}</td><td>${R(paid(c))}</td><td>${R(c.canc?0:debt(c))}</td><td>${D(c.venc)}</td><td>${tag(st(c))}</td><td>${st(c)!='pago'&&!c.canc?`<button class="btn s" onclick="pagar('${c.id}')">Registrar pagamento</button> <button class="btn s" onclick="open2('${c.id}')">WhatsApp</button> <button class="btn s d" onclick="canc('${c.id}')">Cancelar</button>`:''}</td></tr>`).join('')}</table>`:'<div class="empty">Sem cobranças neste mês. Use “Gerar cobranças do mês”.</div>'}</div>`},

pres(){if(!S.t.length)return`<h1>Presença</h1><div class="empty">Cadastre uma turma primeiro.</div>`;const pt=S.t.some(t=>t.id==F.pt)?F.pt:S.t[0].id;F.pt=pt;const l=S.a.filter(a=>a.tid==pt&&a.status=='ativo').sort((a,b)=>a.nome.localeCompare(b.nome));const B=(a,s,r,n,c)=>`<button class="btn s" style="${r&&r.s==s?'background:'+c+';color:#04120a;font-weight:700':''}" onclick="setP('${a.id}','${s}')">${n}</button>`;return`<h1>Presença</h1><div class="sub">Chamada rápida por turma</div><div class="bar"><select onchange="F.pt=this.value;draw()">${S.t.map(t=>`<option value="${t.id}" ${t.id==pt?'selected':''}>${esc(t.nome)}</option>`).join('')}</select><input type="date" value="${F.pd}" onchange="F.pd=this.value||today;draw()"></div><div class="card tb">${l.length?`<table><tr><th>Aluno</th><th>Chamada em ${D(F.pd)}</th><th>Frequência</th></tr>${l.map(a=>{const r=S.p.find(p=>p.aid==a.id&&p.d==F.pd&&p.tid==pt),h=S.p.filter(p=>p.aid==a.id),pr=h.filter(p=>p.s=='P').length;return`<tr><td>${esc(a.nome)}</td><td>${B(a,'P',r,'Presente','#22e06b')} ${B(a,'F',r,'Falta','#ff5d5d')} ${B(a,'J',r,'Justificada','#ffc94d')}</td><td>${h.length?Math.round(pr/h.length*100)+'% ('+pr+'/'+h.length+')':'-'}</td></tr>`}).join('')}</table>`:'<div class="empty">Sem alunos ativos nesta turma</div>'}</div>`},
desp(){const l=S.e.filter(e=>!F.m||(e.data||'').startsWith(F.m)).sort((a,b)=>a.data<b.data?1:-1),rec=S.c.flatMap(c=>c.pag).filter(p=>!F.m||p.d.startsWith(F.m)).reduce((s,p)=>s+p.v,0),dp=l.filter(e=>e.pago).reduce((s,e)=>s+e.valor,0),ap=l.filter(e=>!e.pago).reduce((s,e)=>s+e.valor,0),res=rec-dp;const kp=(k,v,c)=>`<div class="card"><div class="k">${k}</div><div class="v" style="color:${c}">${v}</div></div>`;return`<h1>Despesas</h1><div class="sub">Resultado = recebido − despesas pagas no período</div><div class="bar"><input type="month" value="${F.m}" onchange="F.m=this.value;draw()"><button class="btn" onclick="fDesp()">+ Nova despesa</button></div><div class="grid">${kp('Receitas recebidas',R(rec),'var(--g)')}${kp('Despesas pagas',R(dp),'var(--r)')}${kp('Resultado',R(res),res>=0?'var(--g)':'var(--r)')}${kp('Despesas a pagar',R(ap),'var(--y)')}</div><div class="card tb">${l.length?`<table><tr><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Data</th><th>Vencimento</th><th>Status</th><th></th></tr>${l.map(e=>`<tr><td>${esc(e.desc)}</td><td>${esc(e.cat)}</td><td>${R(e.valor)}</td><td>${D(e.data)}</td><td>${D(e.venc)}</td><td>${tag(e.pago?'pago':(e.venc&&e.venc<today?'atrasado':'pendente'))}</td><td>${e.pago?'':`<button class="btn s" onclick="payE('${e.id}')">Marcar pago</button> `}<button class="btn s" onclick="fDesp('${e.id}')">Editar</button> <button class="btn s d" onclick="delE('${e.id}')">Excluir</button></td></tr>`).join('')}</table>`:'<div class="empty">Nenhuma despesa neste mês</div>'}</div>`},
inad(){const l=S.c.filter(c=>st(c)=='atrasado'&&(!F.t||al(c.aid).tid==F.t)&&days(c.venc,today)>=F.mind).sort((a,b)=>a.venc<b.venc?-1:1),tot=l.reduce((s,c)=>s+debt(c),0);
return`<h1>Inadimplência</h1><div class="sub">${l.length} em atraso · total ${R(tot)}</div><div class="bar"><select onchange="F.t=this.value;draw()"><option value="">Todas as turmas</option>${S.t.map(t=>`<option value="${t.id}" ${F.t==t.id?'selected':''}>${esc(t.nome)}</option>`).join('')}</select><select onchange="F.mind=+this.value;draw()">${[[0,'Qualquer atraso'],[8,'+ de 7 dias'],[16,'+ de 15 dias'],[31,'+ de 30 dias']].map(o=>`<option value="${o[0]}" ${F.mind==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><button class="btn s" onclick="fMsg()">Editar modelo de mensagem</button></div>
<div class="card tb">${l.length?`<table><tr><th>Aluno</th><th>Mês</th><th>Deve</th><th>Dias de atraso</th><th>Responsável</th><th>Telefone</th><th></th></tr>${l.map(c=>{const a=al(c.aid);return`<tr><td>${esc(a.nome)}</td><td>${ML(c.mes)}</td><td style="color:var(--r)">${R(debt(c))}</td><td>${days(c.venc,today)}</td><td>${esc(a.resp)}</td><td>${esc(a.tel)}</td><td><button class="btn" onclick="open2('${c.id}')">Cobrar no WhatsApp</button> <button class="btn s" onclick="pagar('${c.id}')">Pagar</button></td></tr>`}).join('')}</table>`:'<div class="empty">Nenhuma mensalidade em atraso 🎉</div>'}</div>`}
};
const open2=id=>open(S.c.find(c=>c.id==id));
function fAluno(id){const a=S.a.find(x=>x.id==id)||{status:'ativo',mat:today,venc:10};form(id?'Editar aluno':'Novo aluno',[{k:'nome',l:'Nome completo',req:1},{k:'nasc',l:'Data de nascimento',t:'date',req:1},{k:'resp',l:'Responsável legal',req:1},{k:'tel',l:'Telefone do responsável (com DDD)',t:'tel',req:1},{k:'tid',l:'Turma',o:[['','— sem turma —'],...S.t.map(t=>[t.id,t.nome])]},{k:'mat',l:'Data de matrícula',t:'date'},{k:'valor',l:'Mensalidade (R$)',t:'number',req:1},{k:'venc',l:'Dia de vencimento (1–28)',t:'number',req:1},{k:'status',l:'Status',o:[['ativo','Ativo'],['inativo','Inativo'],['aguardando','Aguardando matrícula']]},{k:'obs',l:'Observações'}],a,o=>{if(o.venc<1||o.venc>28){alert('Dia de vencimento deve ser entre 1 e 28');return false}const t=tu(o.tid);if(t&&!id&&S.a.filter(x=>x.tid==t.id&&x.status!='inativo').length>=t.cap&&!confirm('Turma lotada. Matricular mesmo assim?'))return false;if(id)Object.assign(a,o);else S.a.push({id:uid(),...o});draw()})}
function delA(id){if(confirm('Excluir aluno e todas as suas cobranças?')){S.a=S.a.filter(a=>a.id!=id);S.c=S.c.filter(c=>c.aid!=id);draw()}}
function fTurma(id){const t=S.t.find(x=>x.id==id)||{cat:'Sub-11',cap:20,min:9,max:11};form(id?'Editar turma':'Nova turma',[{k:'nome',l:'Nome da turma',req:1},{k:'cat',l:'Categoria',o:['Sub-7','Sub-9','Sub-11','Sub-13','Sub-15','Sub-17'].map(x=>[x,x])},{k:'min',l:'Idade mínima',t:'number'},{k:'max',l:'Idade máxima',t:'number'},{k:'prof',l:'Professor responsável'},{k:'dias',l:'Dias da semana (ex.: Ter/Qui)'},{k:'ini',l:'Início',t:'time'},{k:'fim',l:'Término',t:'time'},{k:'local',l:'Local'},{k:'cap',l:'Capacidade máxima',t:'number',req:1}],t,o=>{if(id)Object.assign(t,o);else S.t.push({id:uid(),...o});draw()})}
function delT(id){if(confirm('Excluir turma? Os alunos ficarão sem turma.')){S.t=S.t.filter(t=>t.id!=id);S.a.forEach(a=>{if(a.tid==id)a.tid=''});draw()}}
function gerar(){if(!F.m){alert('Escolha o mês');return}let n=0;S.a.filter(a=>a.status=='ativo').forEach(a=>{if(S.c.some(c=>c.aid==a.id&&c.mes==F.m))return;S.c.push({id:uid(),aid:a.id,mes:F.m,valor:a.valor,venc:`${F.m}-${pad(a.venc)}`,pag:[],hist:[`${today}: cobrança criada`]});n++});alert(n?`${n} cobranças criadas.`:'Nenhuma cobrança nova (já existem para todos os ativos).');draw()}
function pagar(id){const c=S.c.find(x=>x.id==id);form(`Pagamento — ${al(c.aid).nome}`,[{k:'v',l:`Valor recebido (em aberto: ${R(debt(c))})`,t:'number',req:1},{k:'d',l:'Data do pagamento',t:'date'},{k:'m',l:'Método',o:[['Pix','Pix'],['Dinheiro','Dinheiro'],['Cartão','Cartão'],['Transferência','Transferência']]}],{v:debt(c).toFixed(2),d:today,m:'Pix'},o=>{if(!(o.v>0)){alert('Valor inválido');return false}if(o.v>debt(c)+0.001){alert('Valor maior que o em aberto');return false}c.pag.push({v:o.v,d:o.d||today,m:o.m});(c.hist=c.hist||[]).push(`${today}: pagamento ${R(o.v)} (${o.m})${paid(c)<c.valor?' — parcial':''}`);draw()})}
function canc(id){if(confirm('Cancelar esta cobrança?')){const c=S.c.find(x=>x.id==id);c.canc=1;(c.hist=c.hist||[]).push(`${today}: cobrança cancelada`);draw()}}
function fMsg(){form('Modelo de mensagem',[{k:'msg',l:'Use {aluno}, {mes} e {valor}'}],{msg:S.msg},o=>{S.msg=o.msg;draw()})}
function setP(aid,s){S.p=S.p.filter(p=>!(p.aid==aid&&p.d==F.pd&&p.tid==F.pt));S.p.push({aid,tid:F.pt,d:F.pd,s});draw()}
function fDesp(id){const e=S.e.find(x=>x.id==id)||{cat:'Aluguel',data:today,venc:today,pago:false};form(id?'Editar despesa':'Nova despesa',[{k:'desc',l:'Descrição',req:1},{k:'cat',l:'Categoria',o:['Aluguel','Salários','Materiais esportivos','Uniformes','Transporte','Manutenção','Outros'].map(x=>[x,x])},{k:'valor',l:'Valor (R$)',t:'number',req:1},{k:'data',l:'Data',t:'date',req:1},{k:'venc',l:'Vencimento',t:'date'},{k:'st',l:'Status',o:[['pendente','Pendente'],['pago','Pago']]}],{...e,st:e.pago?'pago':'pendente'},o=>{if(!(o.valor>0)){alert('Valor inválido');return false}const x={desc:o.desc,cat:o.cat,valor:o.valor,data:o.data,venc:o.venc,pago:o.st=='pago'};if(id)Object.assign(e,x);else S.e.push({id:uid(),...x});draw()})}
function payE(id){S.e.find(e=>e.id==id).pago=true;draw()}
function delE(id){if(confirm('Excluir despesa?')){S.e=S.e.filter(e=>e.id!=id);draw()}}

S.a=n.map(x=>({id:uid(),nome:x[0],nasc:x[1],resp:x[2],tel:x[3],tid:x[4],mat:today,valor:x[5],venc:5,status:'ativo'}));
